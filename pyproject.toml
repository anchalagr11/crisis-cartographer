[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisis-cartographer"
version = "0.1.0"
description = "Crisis analysis and comparison application"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "redis",
    "openai",
]

[tool.setuptools]
packages = ["backend"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
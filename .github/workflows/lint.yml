name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff
      - name: Run Black
        run: black . --check
      - name: Run Isort
        run: isort . --check-only
      - name: Run Ruff
        run: ruff check .
